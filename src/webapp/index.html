<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expeditor — call intake</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%98%8E%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f2ee; --surface:#fffefb; --sunk:#eceae4;
  --ink:#191815; --ink-2:#4a4741; --muted:#8b867c;
  --rule:#dedad1; --rule-2:#c9c4b8;
  --accent:#1f4f43; --accent-soft:#e3ede9;
  --warn:#8a5a20; --danger:#8c2f2a;
  --serif:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"Roboto Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121210; --surface:#1b1b18; --sunk:#232320;
    --ink:#edeae3; --ink-2:#bcb7ad; --muted:#8b867c;
    --rule:#2d2d28; --rule-2:#3c3b35;
    --accent:#79b3a1; --accent-soft:#1d2a26;
    --warn:#c79552; --danger:#d0837c;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}

/* ---------- shell ---------- */
.shell{height:100dvh;display:flex;flex-direction:column}
header{
  display:flex;align-items:baseline;gap:14px;
  padding:14px 22px 12px; border-bottom:1px solid var(--rule);
  background:var(--surface);
}
.mark{font:600 19px/1 var(--serif); letter-spacing:-.01em}
.mark em{font-style:normal;color:var(--accent)}
.tag{
  font:500 10.5px/1 var(--sans); letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); padding-top:3px;
}
header .spacer{flex:1}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px}

main{
  flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);
}
@media (max-width:900px){ main{grid-template-columns:1fr;grid-template-rows:1fr auto} }

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule)}
.log{flex:1;overflow-y:auto;padding:26px 30px 8px}
.turn{max-width:62ch;margin:0 0 22px}
.who{
  font:500 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px;
}
.turn.agent .body{border-left:2px solid var(--rule-2);padding-left:14px;color:var(--ink)}
.turn.you{margin-left:auto}
.turn.you .who{text-align:right}
.turn.you .body{
  background:var(--sunk);border:1px solid var(--rule);border-radius:3px;
  padding:9px 13px;color:var(--ink-2);
}
.turn .body{white-space:pre-wrap}
.thinking{color:var(--muted);font-style:italic;padding-left:16px}
.thinking span{animation:blink 1.3s infinite}
.thinking span:nth-child(2){animation-delay:.18s}
.thinking span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

.composer{border-top:1px solid var(--rule);background:var(--surface);padding:12px 18px 14px}
.composer .row{display:flex;gap:10px;align-items:flex-end}
textarea{
  flex:1;resize:none;min-height:44px;max-height:160px;
  background:var(--bg);border:1px solid var(--rule-2);border-radius:4px;
  padding:11px 12px;outline:none;
}
textarea:focus{border-color:var(--accent)}
.send{
  border:1px solid var(--ink);background:var(--ink);color:var(--bg);
  border-radius:4px;padding:11px 18px;cursor:pointer;font-weight:500;
}
.send:disabled{opacity:.35;cursor:default}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px}

/* ---------- brief ---------- */
.brief{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.brief-head{padding:20px 24px 0}
.brief-head h2{font:600 15px/1 var(--serif);margin:0 0 3px;letter-spacing:.01em}
.brief-head p{margin:0;font-size:12px;color:var(--muted)}
.meter{height:2px;background:var(--rule);margin:16px 0 0;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0;transition:width .45s cubic-bezier(.2,.7,.2,1)}

.groups{flex:1;overflow-y:auto;padding:6px 24px 18px}
.group{border-bottom:1px solid var(--rule);padding:16px 0 12px}
.group:last-child{border-bottom:0}
.group h3{
  font:500 10px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin:0 0 11px;
}
.f{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;margin:0 0 9px;align-items:baseline}
.f dt{font-size:12.5px;color:var(--ink-2)}
.f dd{margin:0;font-family:var(--mono);font-size:12.5px;color:var(--ink);word-break:break-word}
.f dd.empty{font-family:var(--sans);color:var(--muted);font-style:italic}
.f dd.empty::before{content:"— "}
.f.hit dd{animation:land 1.4s ease-out}
@keyframes land{0%{background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft)}100%{background:transparent;box-shadow:none}}
.note{font-size:11.5px;color:var(--muted);font-family:var(--sans);margin-top:2px}
dl{margin:0}
.tgt{display:block;margin-bottom:3px}
.tgt .no{color:var(--warn)}
.skip{
  font-family:var(--sans);font-size:12.5px;color:var(--ink-2);
  background:var(--sunk);border-left:2px solid var(--rule-2);padding:8px 11px;
}

/* ---------- launch ---------- */
.launch{
  border-top:1px solid var(--rule);padding:16px 24px 20px;background:var(--surface);
  max-height:58%;overflow-y:auto;
  box-shadow:0 -10px 14px -14px rgba(0,0,0,.35);
}
.absolute{
  font-size:11.5px;color:var(--muted);margin:0 0 12px;padding-left:11px;
  border-left:2px solid var(--rule-2);
}
.absolute b{color:var(--ink-2);font-weight:600}
.go{
  width:100%;padding:13px;border-radius:4px;cursor:pointer;font-weight:600;
  border:1px solid var(--accent);background:var(--accent);color:#fff;letter-spacing:.01em;
}
@media (prefers-color-scheme:dark){ .go{color:#0f1614} }
.go:disabled{background:transparent;color:var(--muted);border-color:var(--rule-2);cursor:default}
.blockers{margin:11px 0 0;padding:0;list-style:none;font-size:12px;color:var(--muted)}
.blockers li{padding-left:14px;position:relative;margin-bottom:3px}
.blockers li::before{content:"·";position:absolute;left:4px;color:var(--rule-2)}

.callcard{margin-top:14px;border:1px solid var(--rule);border-radius:4px;padding:13px 14px;font-size:12.5px}
.callcard h4{margin:0 0 9px;font:600 12px/1 var(--sans);letter-spacing:.04em}
.callcard .kv{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px;font-family:var(--mono);font-size:11.5px}
.callcard .kv b{font-weight:400;color:var(--muted);font-family:var(--sans)}
.state{font-weight:600}
.state.ok{color:var(--accent)} .state.bad{color:var(--danger)} .state.wait{color:var(--warn)}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="mark">Expedit<em>o</em>r</div>
    <div class="tag">outbound call intake</div>
    <div class="spacer"></div>
    <div class="tag"><span class="dot"></span><span id="status">ready</span></div>
  </header>

  <main>
    <section class="chat">
      <div class="log" id="log"></div>
      <div class="composer">
        <div class="row">
          <textarea id="input" rows="1" placeholder="Describe the job — who to call and what you want out of it."></textarea>
          <button class="send" id="send">Send</button>
        </div>
        <div class="hint">Enter to send · Shift+Enter for a new line</div>
      </div>
    </section>

    <aside class="brief">
      <div class="brief-head">
        <h2>The brief</h2>
        <p id="progress">Nothing established yet.</p>
        <div class="meter"><i id="meter"></i></div>
      </div>
      <div class="groups" id="groups"></div>
      <div class="launch">
        <p class="absolute"><b>No escalation.</b> Whatever you set here is the
          whole mandate. Nobody is asked mid-call — the agent finds a deal inside
          these limits or ends the call politely.</p>
        <button class="go" id="go" disabled>Launch the call</button>
        <ul class="blockers" id="blockers"></ul>
        <div id="call"></div>
      </div>
    </aside>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let SESSION = null, FIELDS = null, PREV = {}, POLL = null, LAUNCHED = false;

const CLOSE_LABEL = {
  written_confirmation: "written confirmation (SMS or email)",
  booked_meeting: "a booked slot on a calendar",
  delivered_artifact: "something delivered we can check",
};

/* ---------- rendering the transcript ---------- */
function renderLog(messages){
  const log = $("log");
  log.innerHTML = "";
  for (const m of messages){
    const t = document.createElement("div");
    t.className = "turn " + (m.role === "user" ? "you" : "agent");
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = m.role === "user" ? "You" : "Intake";
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = m.text;
    t.append(who, body);
    log.append(t);
  }
  log.scrollTop = log.scrollHeight;
}

function thinking(on){
  const old = document.querySelector(".thinking");
  if (old) old.remove();
  if (!on) return;
  const d = document.createElement("div");
  d.className = "thinking";
  d.innerHTML = "thinking<span>.</span><span>.</span><span>.</span>";
  $("log").append(d);
  $("log").scrollTop = $("log").scrollHeight;
}

/* ---------- rendering the brief ---------- */
function value(fid, s){
  switch (fid){
    case "kind": return s.kind ? (s.kind === "sale" ? "a sale" : "an errand") : null;
    case "targets": return s.targets.length ? s.targets : null;
    case "capacity_total":
      return s.capacity_total ? `${s.capacity_total} ${s.unit_label || "units"}` : null;
    case "max_qty":
      return s.max_qty ? `${s.max_qty} ${s.unit_label || "units"}` : null;
    case "max_discount_pct":
      return s.max_discount_pct === null || s.max_discount_pct === undefined
        ? null : `${s.max_discount_pct}% off list`;
    case "date_window":
      return (s.earliest_date && s.latest_date) ? `${s.earliest_date} → ${s.latest_date}` : null;
    case "economics": return s.economics && s.has_pricing ? s.economics : null;
    case "close_condition":
      return s.close_condition ? (CLOSE_LABEL[s.close_condition] || s.close_condition) : null;
    default: return s[fid] || null;
  }
}

/* Mirrors _singular() in spec.py, so the panel and the cost model agree on
   what one unit is called. "pastries" is one "pastry", never one "pastrie". */
function singular(label){
  label = (label || "").trim();
  if (label.length > 3 && label.endsWith("ies")) return label.slice(0, -3) + "y";
  if (label.length > 2 && label.endsWith("s") && !label.endsWith("ss")) return label.slice(0, -1);
  return label || "unit";
}

function economicsRow(e, unit){
  const u = unit ? `/${singular(unit)}` : "";
  const money = (n) => n === null || n === undefined ? "—" : Number(n).toFixed(2);
  return `materials ${money(e.materials_per_unit)}${u} · labour ${money(e.labor_per_unit)}${u}`
       + ` · transport ${money(e.transport_per_unit)}${u}`
       + `<div class="note">floor margin ${e.min_margin_pct ?? "—"}% · target `
       + `${e.target_margin_pct ?? e.min_margin_pct ?? "—"}%</div>`;
}

function targetsRow(targets){
  return targets.map(t => {
    const num = t.dialable
      ? t.phone
      : `<span class="no">${t.phone || t.find_hint || "no number"}</span>`;
    return `<span class="tgt">${escapeHtml(t.name || "unnamed")} · ${num}</span>`;
  }).join("");
}

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function renderBrief(s, changed){
  const kind = s.kind || "errand";
  const wrap = $("groups");
  wrap.innerHTML = "";
  const required = new Set(s.required);

  for (const g of FIELDS.groups){
    const fields = FIELDS.fields.filter(f => f.group === g.id && f.kinds.includes(kind));
    const skipped = g.id === "economics" && kind === "errand";
    if (!fields.length && !skipped) continue;

    const sec = document.createElement("div");
    sec.className = "group";
    sec.innerHTML = `<h3>${g.label}</h3>`;

    if (skipped){
      const d = document.createElement("div");
      d.className = "skip";
      d.textContent = s.pricing_note
        || "Skipped — this is an errand, not a sale. No unit economics to gather, and none will be invented.";
      sec.append(d);
      wrap.append(sec);
      continue;
    }

    const dl = document.createElement("dl");
    for (const f of fields){
      const v = value(f.id, s);
      const row = document.createElement("div");
      row.className = "f" + (changed && changed.includes(f.id) ? " hit" : "");
      const dt = document.createElement("dt");
      // A one-field group already says the label in its heading.
      dt.textContent = f.id === "economics" ? "Per unit" : f.label;
      const dd = document.createElement("dd");
      if (v === null || v === undefined || v === ""){
        dd.className = "empty";
        dd.textContent = required.has(f.id) ? "not yet" : "optional";
      } else if (f.id === "targets"){
        dd.innerHTML = targetsRow(v);
      } else if (f.id === "economics"){
        dd.innerHTML = economicsRow(v, s.unit_label);
      } else {
        dd.textContent = v;
      }
      row.append(dt, dd);
      dl.append(row);
    }
    sec.append(dl);
    wrap.append(sec);
  }

  const done = s.required.length - s.missing.length;
  $("meter").style.width = (100 * done / Math.max(1, s.required.length)) + "%";
  $("progress").textContent = s.missing.length
    ? `${done} of ${s.required.length} established.`
    : (s.can_launch ? "Complete. Ready to dial." : "Complete, but not dialable yet.");

  // Follow the conversation: bring whatever just landed into view, rather than
  // leaving the operator to hunt for what changed in a panel of fifteen rows.
  const landed = wrap.querySelector(".f.hit");
  if (landed) landed.scrollIntoView({block: "nearest", behavior: "smooth"});

  // Once a call is placed the button stays down. A second click is a second
  // real phone ringing, which is never what the operator meant.
  $("go").disabled = LAUNCHED || !s.can_launch;
  const bl = $("blockers");
  bl.innerHTML = "";
  if (!s.can_launch && !LAUNCHED){
    for (const b of s.blockers.slice(0, 6)){
      const li = document.createElement("li");
      li.textContent = b;
      bl.append(li);
    }
  }
}

/* ---------- wire ---------- */
async function boot(){
  FIELDS = await (await fetch("/api/fields")).json();
  const s = await (await fetch("/api/session", {method:"POST"})).json();
  SESSION = s.id;
  PREV = s;
  renderLog(s.messages);
  renderBrief(s.spec, []);
  $("input").focus();
}

async function send(){
  const box = $("input");
  const text = box.value.trim();
  if (!text || !SESSION) return;
  box.value = ""; box.style.height = "auto";
  $("send").disabled = true;
  $("status").textContent = "interviewing";

  renderLog([...currentMessages(), {role:"user", text}]);
  thinking(true);

  try{
    const res = await fetch("/api/message", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({session_id: SESSION, text}),
    });
    const data = await res.json();
    thinking(false);
    if (data.error){ throw new Error(data.error); }
    PREV = data;
    renderLog(data.messages);
    renderBrief(data.spec, data.changed || []);
    $("status").textContent = data.finished ? "brief complete" : "interviewing";
  } catch (err){
    thinking(false);
    $("status").textContent = "connection trouble";
    const log = $("log");
    const d = document.createElement("div");
    d.className = "turn agent";
    d.innerHTML = `<div class="who">Intake</div><div class="body">Something went wrong reaching the server (${escapeHtml(err.message)}). Say that again.</div>`;
    log.append(d);
  } finally {
    $("send").disabled = false;
    box.focus();
  }
}

function currentMessages(){ return (PREV.messages) || []; }

async function launch(){
  $("go").disabled = true;
  $("status").textContent = "dialling";
  const res = await fetch("/launch", {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({session_id: SESSION}),
  });
  const data = await res.json();
  if (data.error){
    $("status").textContent = "launch refused";
    renderCall({refused: data.error, blockers: data.blockers || []});
    $("go").disabled = false;
    return;
  }
  LAUNCHED = true;
  $("go").textContent = "Call placed";
  renderCall({dial: data.dial, target: data.target, room: data.room});
  $("status").textContent = data.dial.ok ? "on the call" : "call failed";
  const st = await (await fetch("/api/session/" + SESSION)).json();
  PREV = st; renderLog(st.messages);
  poll(data.room);
}

function renderCall(x){
  const box = $("call");
  if (x.refused){
    box.innerHTML = `<div class="callcard"><h4>Launch refused</h4>
      <div class="kv"><b>reason</b><span class="state bad">${escapeHtml(x.refused)}</span></div>
      ${x.blockers.map(b => `<div class="kv"><b></b><span>${escapeHtml(b)}</span></div>`).join("")}
    </div>`;
    return;
  }
  const d = x.dial;
  const cls = d.ok ? "ok" : (d.dispatched ? "wait" : "bad");
  const state = d.answered ? "answered" : (d.dispatched ? "no answer" : "not dispatched");
  box.innerHTML = `<div class="callcard">
    <h4>Call placed</h4>
    <div class="kv"><b>to</b><span>${escapeHtml(x.target.name || "")} ${escapeHtml(d.to_number)}</span></div>
    <div class="kv"><b>room</b><span>${escapeHtml(x.room)}</span></div>
    <div class="kv"><b>status</b><span class="state ${cls}">${state}</span></div>
    ${d.detail ? `<div class="kv"><b>detail</b><span>${escapeHtml(d.detail)}</span></div>` : ""}
    <div class="kv" id="receipt-line"><b>receipt</b><span class="state wait">no receipt yet</span></div>
  </div>`;
}

function poll(room){
  if (POLL) clearInterval(POLL);
  POLL = setInterval(async () => {
    try{
      const r = await (await fetch("/api/call/" + room)).json();
      const line = $("receipt-line");
      if (!line) return;
      if (r.receipt){
        const h = r.receipt.headline || "";
        const cls = h.startsWith("SUCCESS") ? "ok" : (h.startsWith("FAILED") ? "bad" : "wait");
        line.innerHTML = `<b>receipt</b><span class="state ${cls}">${escapeHtml(h)}</span>`;
        clearInterval(POLL);
      }
    } catch (e){ /* a dropped poll costs three seconds, not the page */ }
  }, 3000);
}

$("send").addEventListener("click", send);
$("go").addEventListener("click", launch);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(160, e.target.scrollHeight) + "px";
});
boot();
</script>
</body>
</html>
